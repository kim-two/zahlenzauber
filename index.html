<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffaf0">
    <meta name="apple-mobile-web-app-title" content="Zahlenzauber">
    <title>Zahlenzauber</title>
    <meta name="description" content="Kindgerechte Deutsch- und Matheaufgaben für die Grundschule.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Zur Startseite">
          <span class="brand-mark" aria-hidden="true">Zz</span>
          <span>
            <strong>Zahlenzauber</strong>
            <small>Üben für die Grundschule</small>
          </span>
        </button>

        <div class="topbar-status">
          <button class="garden-button" type="button" data-action="open-garden">
            <span aria-hidden="true">✿</span>
            Garten
          </button>
          <div class="star-counter" id="starCounter" aria-live="polite">
            <span aria-hidden="true">★</span>
            <strong id="starCount">0</strong>
          </div>
          <div class="progress-dots" id="progressDots" aria-label="Fortschritt"></div>
        </div>
      </header>

      <main id="app" class="screen" tabindex="-1"></main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
